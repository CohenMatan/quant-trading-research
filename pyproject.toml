[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qresearch"
version = "0.2.0"
description = "Phase 1 research tooling: QuantConnect Cloud runner, metrics, validation statistics"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qresearch = ["lean/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs QuantConnect credentials and network (skipped by default)"]
